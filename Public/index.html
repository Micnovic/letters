<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <title>Fridge Letters Game</title>
    <style>
        body {
            overflow: hidden; /* Prevent scrolling */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        canvas {
            border: 1px solid #000;
            background-color: #fff;
            width: 100%;
            height: auto;
            max-width: 800px;
            max-height: 600px;
        }
        div {
            font-size: 12px; /* Smaller font size */
            color: #555; /* Gray color for the text */
            margin-top: 20px; /* Space between canvas and text */
            padding: 5px; /* Optional: Add padding around the footer text */
            font-family: 'Nunito', sans-serif; /* Change font to Roboto */
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="footer">Made by Gleb Micnovic in 2025</div>
    <script src="game.js"></script>
</body>
</html>
